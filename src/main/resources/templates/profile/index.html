<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${pageTitle}, ~{::content})}">
<body>
<div th:fragment="content">
    <section class="page-hero mb-3">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
            <div>
                <div class="page-kicker">个人中心</div>
                <h1 class="page-title mb-1">个人资料</h1>
                <p class="page-subtitle mb-0">维护头像、姓名、班级方向和账号安全信息。</p>
            </div>
            <a class="btn btn-outline-danger btn-lg rounded-pill px-4" href="/logout">退出登录</a>
        </div>
    </section>

    <div th:if="${param.updated}" class="alert alert-success mt-3">个人信息更新成功！</div>

    <div class="row g-3 mt-1">
        <div class="col-lg-4">
            <div class="soft-card h-100 text-center">
                <div class="mb-4 mt-2">
                    <img th:if="${user.avatar != null}" th:src="${user.avatar}" alt="avatar" class="rounded-circle shadow-sm" style="width: 120px; height: 120px; object-fit: cover;">
                    <div th:if="${user.avatar == null}" class="rounded-circle bg-secondary text-white d-inline-flex align-items-center justify-content-center shadow-sm" style="width: 120px; height: 120px; font-size: 3rem;">
                        <i class="bi bi-person-fill"></i>
                    </div>
                </div>
                <h3 class="mb-1" th:text="${user.realName != null and !user.realName.isEmpty() ? user.realName : user.username}">Name</h3>
                <div class="d-flex justify-content-center gap-2 flex-wrap mb-3">
                    <span class="badge bg-tp-soft text-tp-primary" th:text="${user.role.name() == 'ADMIN' ? '管理员' : (user.role.name() == 'TEACHER' ? '教师' : '学生')}">角色</span>
                    <span class="badge text-bg-success" th:if="${user.enabled}">账号正常</span>
                    <span class="badge text-bg-danger" th:if="${!user.enabled}">账号禁用</span>
                </div>

                <div class="border rounded-4 p-3 bg-light text-start">
                    <div class="fw-semibold mb-2">当前信息</div>
                    <div class="small text-muted mb-1">用户名：<span th:text="${user.username}">username</span></div>
                    <div class="small text-muted mb-1" th:if="${user.role.name() == 'STUDENT'}">当前班级：<span th:text="${displayClassName != null ? displayClassName : '未设置'}">班级</span></div>
                    <div class="small text-muted mb-1" th:if="${user.role.name() == 'TEACHER'}">教学方向：<span th:text="${user.mealCategory != null ? user.mealCategory : '未设置'}">方向</span></div>
                    <div class="small text-muted mb-1" th:if="${user.role.name() == 'ADMIN'}">权限说明：系统管理账号</div>
                    <div class="small text-muted" th:if="${user.birthday != null}">出生日期：<span th:text="${user.birthday}">生日</span></div>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="soft-card">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                    <div>
                        <h3 class="mb-0">基础资料</h3>
                        <div class="text-muted small">不同角色显示不同资料项。</div>
                    </div>
                </div>

                <form method="post" th:action="@{/profile}" enctype="multipart/form-data">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted small">真实姓名</label>
                            <input type="text" class="form-control form-control-lg" name="realName" th:value="${user.realName}" placeholder="请输入姓名">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small">上传头像</label>
                            <input type="file" class="form-control form-control-lg" name="avatarFile" accept="image/jpeg,image/png,image/webp">
                        </div>

                        <div class="col-md-6" th:if="${user.role.name() == 'STUDENT'}">
                            <label class="form-label text-muted small">菜系 / 专业方向</label>
                            <select class="form-select form-select-lg" name="mealCategory">
                                <option value="" th:selected="${user.mealCategory == null or user.mealCategory.isEmpty()}">请选择菜系</option>
                                <option th:each="c : ${courseCategories}" th:value="${c}" th:selected="${user.mealCategory == c}" th:text="${c}">菜系</option>
                            </select>
                        </div>
                        <div class="col-md-6" th:if="${user.role.name() == 'STUDENT'}">
                            <label class="form-label text-muted small">班级号</label>
                            <select class="form-select form-select-lg" name="classLevel">
                                <option value="" th:selected="${user.classLevel == null}">请选择班级号</option>
                                <option th:each="n : ${classLevels}" th:value="${n}" th:selected="${user.classLevel != null and user.classLevel == n}" th:text="${n + '班'}">班级号</option>
                            </select>
                        </div>

                        <div class="col-md-6" th:if="${user.role.name() == 'TEACHER'}">
                            <label class="form-label text-muted small">主要教学方向</label>
                            <select class="form-select form-select-lg" name="mealCategory">
                                <option value="" th:selected="${user.mealCategory == null or user.mealCategory.isEmpty()}">请选择教学方向</option>
                                <option th:each="c : ${courseCategories}" th:value="${c}" th:selected="${user.mealCategory == c}" th:text="${c}">分类</option>
                            </select>
                        </div>
                        <input type="hidden" name="classLevel" th:if="${user.role.name() != 'STUDENT'}" th:value="${user.classLevel}">
                        <input type="hidden" name="mealCategory" th:if="${user.role.name() == 'ADMIN'}" th:value="${user.mealCategory}">

                        <div class="col-md-6">
                            <label class="form-label text-muted small">出生日期</label>
                            <input type="date" class="form-control form-control-lg" name="birthday" th:value="${user.birthday}">
                        </div>
                    </div>
                    <div class="text-end mt-4">
                        <button type="submit" class="btn btn-tp-primary btn-lg rounded-pill px-4">保存基础资料</button>
                    </div>
                </form>
            </div>

            <div class="soft-card mt-4">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                    <h3 class="mb-0">账号安全</h3>
                    <span class="badge bg-warning text-dark">密码维护</span>
                </div>
                <div th:if="${pwdSuccess}" class="alert alert-success small py-2" th:text="${pwdSuccess}"></div>
                <div th:if="${pwdError}" class="alert alert-danger small py-2" th:text="${pwdError}"></div>

                <details>
                    <summary class="btn btn-outline-danger rounded-pill px-4">展开修改密码</summary>
                    <form method="post" th:action="@{/profile/password}" class="mt-3">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label text-muted small">原密码</label>
                                <input type="password" class="form-control" name="oldPassword" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small">新密码</label>
                                <input type="password" class="form-control" name="newPassword" required minlength="6" placeholder="至少6位">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small">确认新密码</label>
                                <input type="password" class="form-control" name="confirmPassword" required minlength="6">
                            </div>
                        </div>
                        <div class="text-end mt-4">
                            <button type="submit" class="btn btn-outline-danger rounded-pill px-4">修改密码</button>
                        </div>
                    </form>
                </details>
            </div>
        </div>
    </div>
</div>
</body>
</html>
