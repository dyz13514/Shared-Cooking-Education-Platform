<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${pageTitle}, ~{::content})}">
<body>
<div th:fragment="content">
    <section class="page-hero mb-3">
        <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">
            <div>
                <div class="page-kicker">课程管理</div>
                <h1 class="page-title mb-1">新建课程</h1>
            </div>
            <a class="btn btn-outline-secondary rounded-pill px-4" href="/admin/courses">返回</a>
        </div>
    </section>
    <section class="soft-card">
        <form method="post" th:action="@{/admin/courses}" th:object="${course}" enctype="multipart/form-data">
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">课程名称</label><input class="form-control" th:field="*{title}" required maxlength="100"></div>
                <div class="col-md-3"><label class="form-label">课程大类</label><select class="form-select" th:field="*{category}"><option value="中餐">中餐</option><option value="西餐">西餐</option><option value="日料">日料</option></select></div>
                <div class="col-md-3"><label class="form-label">允许开课教师类别</label><select class="form-select" th:field="*{allowedTeacherCategory}"><option value="">默认同课程大类</option><option value="中餐">中餐教师</option><option value="西餐">西餐教师</option><option value="日料">日料教师</option></select></div>
                <div class="col-md-4"><label class="form-label">负责人教师</label><select class="form-select" th:field="*{teacherId}" required><option value="">请选择</option><option th:each="t : ${teachers}" th:value="${t.id}" th:text="${(t.realName != null and !t.realName.isBlank()) ? t.realName + '（' + t.username + '）' : t.username}"></option></select></div>
                <div class="col-md-4"><label class="form-label">目标班级</label><input class="form-control" th:field="*{targetClass}" placeholder="中餐1班"></div>
                <div class="col-md-4"><label class="form-label">封面上传</label><input class="form-control" type="file" name="coverFile" accept="image/jpeg,image/png,image/webp"></div>
                <div class="col-md-4"><label class="form-label">封面地址</label><input class="form-control" th:field="*{coverImage}" placeholder="可选"></div>
                <div class="col-12"><label class="form-label">课程简介</label><textarea class="form-control" rows="5" th:field="*{description}"></textarea></div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary rounded-pill px-4" href="/admin/courses">取消</a><button class="btn btn-tp-primary rounded-pill px-5" type="submit">保存</button></div>
        </form>
    </section>
</div>
</body>
</html>
