<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${pageTitle}, ~{::content})}">
<body>
<div th:fragment="content">
    <section class="page-hero mb-3">
        <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">
            <div>
                <div class="page-kicker">用户管理</div>
                <h1 class="page-title mb-1">编辑账号</h1>
            </div>
            <a class="btn btn-outline-secondary rounded-pill px-4" href="/admin/users">返回</a>
        </div>
    </section>
    <section class="soft-card">
        <form method="post" th:action="@{/admin/users/{id}(id=${user.id})}" th:object="${form}">
            <div class="row g-3">
                <div class="col-md-4"><label class="form-label">用户名</label><input class="form-control" th:field="*{username}" required></div>
                <div class="col-md-4"><label class="form-label">重置密码</label><input class="form-control" type="password" th:field="*{password}" placeholder="留空则不修改"></div>
                <div class="col-md-4"><label class="form-label">姓名</label><input class="form-control" th:field="*{realName}"></div>
                <div class="col-md-3"><label class="form-label">角色</label><select class="form-select" th:field="*{role}"><option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option></select></div>
                <div class="col-md-3"><label class="form-label">专业方向</label><input class="form-control" th:field="*{mealCategory}"></div>
                <div class="col-md-3"><label class="form-label">班级编号</label><input class="form-control" type="number" th:field="*{classLevel}"></div>
                <div class="col-md-3"><label class="form-label">班级名称</label><input class="form-control" th:field="*{className}"></div>
                <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" th:field="*{enabled}"><label class="form-check-label">启用账号</label></div></div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary rounded-pill px-4" href="/admin/users">取消</a><button class="btn btn-tp-primary rounded-pill px-5" type="submit">保存</button></div>
        </form>
    </section>
</div>
</body>
</html>
