<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${pageTitle}, ~{::content})}">
<body>
<div th:fragment="content">
    <section class="page-hero mb-3">
        <div class="d-flex align-items-start justify-content-between gap-3 flex-wrap">
            <div>
                <div class="page-kicker">管理员后台</div>
                <h1 class="page-title mb-1">用户管理</h1>
                <p class="page-subtitle mb-0">统一维护管理员、教师和学生账号。</p>
            </div>
            <a class="btn btn-tp-primary rounded-pill px-4" href="/admin/users/new">新建账号</a>
        </div>
    </section>

    <section class="soft-card">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>姓名</th>
                    <th>角色</th>
                    <th>班级/方向</th>
                    <th>状态</th>
                    <th class="text-end">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td class="text-muted" th:text="${u.id}">1</td>
                    <td class="fw-semibold" th:text="${u.username}">username</td>
                    <td th:text="${u.realName != null ? u.realName : '—'}">姓名</td>
                    <td><span class="badge text-bg-secondary" th:text="${u.role}">ROLE</span></td>
                    <td class="text-muted small" th:text="${(u.mealCategory != null ? u.mealCategory : '') + (u.classLevel != null ? u.classLevel + '班' : '') + (u.className != null and !u.className.isBlank() ? ' / ' + u.className : '')}">班级</td>
                    <td><span class="badge" th:classappend="${u.enabled ? ' text-bg-success' : ' text-bg-danger'}" th:text="${u.enabled ? '启用' : '禁用'}">状态</span></td>
                    <td class="text-end">
                        <div class="d-inline-flex gap-2">
                            <a class="btn btn-outline-primary btn-sm" th:href="@{/admin/users/{id}/edit(id=${u.id})}">编辑</a>
                            <form method="post" th:action="@{/admin/users/{id}/toggle(id=${u.id})}">
                                <button class="btn btn-outline-secondary btn-sm" type="submit" th:text="${u.enabled ? '禁用' : '启用'}">切换</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>
</body>
</html>
