<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${pageTitle}, ~{::content})}">
<body>
<div th:fragment="content" class="row justify-content-center">
    <div class="col-lg-9">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
                <h1 class="h4 mb-1">修改课时</h1>
                <div class="text-muted small" th:text="${course.title}">课程标题</div>
            </div>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/teacher/courses/{courseId}(courseId=${course.id})}">返回</a>
        </div>

        <div class="bg-white border rounded-4 shadow-sm p-3 p-md-4">
            <div class="alert alert-warning border-0" th:if="${lessonError != null}">
                <span th:text="${lessonError}">冲突提示</span>
            </div>
            <form method="post" th:action="@{/teacher/courses/{courseId}/lessons/{lessonId}/update(courseId=${course.id},lessonId=${lesson.id})}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">标题</label>
                        <input class="form-control" name="title" th:value="${lesson.title}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">菜品名称</label>
                        <input class="form-control" name="dishName" th:value="${lesson.dishName}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">顺序</label>
                        <input class="form-control" name="sortOrder" type="number" min="1" step="1" th:value="${lesson.sortOrder}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">状态</label>
                        <select class="form-select" name="status">
                            <option value="NOT_STARTED" th:selected="${lesson.status == 'NOT_STARTED'}">未开始</option>
                            <option value="DOING" th:selected="${lesson.status == 'DOING'}">进行中</option>
                            <option value="COMPLETED" th:selected="${lesson.status == 'COMPLETED'}">已完成</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">简介</label>
                        <textarea class="form-control" rows="4" name="summary" th:text="${lesson.summary}"></textarea>
                    </div>
                </div>
                <div class="mt-4 d-flex justify-content-between">
                    <a class="btn btn-outline-danger rounded-pill" th:href="@{/teacher/courses/{courseId}(courseId=${course.id})}" onclick="return confirm('如果想删除请回到课程详情页操作');">取消</a>
                    <button class="btn btn-tp-primary rounded-pill px-4" type="submit">保存修改</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
