<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${pageTitle}, ~{::content})}">
<body>
<div th:fragment="content">
    <section class="page-hero">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
            <div>
                <div class="page-kicker">教师工作台</div>
                <h1 class="page-title mb-0">教师首页</h1>
                <p class="page-subtitle mb-0">先看公告，再进入教学管理。</p>
            </div>
            <span class="pill-status"><i class="bi bi-megaphone"></i>首页公告区</span>
        </div>
    </section>

    <section class="metric-grid mt-3">
        <a class="metric-card text-decoration-none" href="/teacher/submissions">
            <div class="metric-label text-dark">待批改提交</div>
            <div class="metric-value text-primary" th:text="${pendingGrades}">0</div>
            <div class="text-muted small mt-1">优先处理</div>
        </a>
        <a class="metric-card text-decoration-none" href="/teacher/tasks">
            <div class="metric-label text-dark">已发布任务</div>
            <div class="metric-value text-success" th:text="${publishedTasks}">0</div>
            <div class="text-muted small mt-1">课堂任务</div>
        </a>
        <a class="metric-card text-decoration-none" href="/teacher/courses">
            <div class="metric-label text-dark">我的课程</div>
            <div class="metric-value text-info" th:text="${courseCount}">0</div>
            <div class="text-muted small mt-1">负责课程</div>
        </a>
        <a class="metric-card text-decoration-none" href="/teacher/resources">
            <div class="metric-label text-dark">教学资源</div>
            <div class="metric-value text-primary" th:text="${resourcesCount}">0</div>
            <div class="text-muted small mt-1">上课资料</div>
        </a>
        <a class="metric-card text-decoration-none" href="/announcements">
            <div class="metric-label text-dark">公告</div>
            <div class="metric-value text-primary" th:text="${announcementsCount}">0</div>
            <div class="text-muted small mt-1">课程通知</div>
        </a>
    </section>

    <section class="soft-card mt-3">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <div>
                <h3 class="mb-1">首页公告区</h3>
            </div>
            <a class="btn btn-tp-primary rounded-pill px-4" href="/announcements">查看更多公告</a>
        </div>
        <div class="row g-3" th:if="${announcements != null and !announcements.isEmpty()}">
            <div class="col-12" th:each="a : ${announcements}">
                <a class="text-decoration-none text-dark" th:href="@{/announcements/{id}(id=${a.id})}">
                    <div class="border rounded-4 p-3 p-md-4 course-card">
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
                            <span class="badge bg-tp-soft text-tp-primary" th:text="${a.category != null ? a.category : '公告'}">公告</span>
                            <span class="text-muted small" th:text="${#temporals.format(a.createdAt, 'yyyy-MM-dd HH:mm')}">time</span>
                        </div>
                        <div class="fs-5 fw-bold mb-2" th:text="${a.title}">title</div>
                        <div class="text-muted small" th:text="${a.content}">content</div>
                    </div>
                </a>
            </div>
        </div>
        <div th:if="${announcements == null or announcements.isEmpty()}" class="text-muted">暂无公告</div>
    </section>
</div>
</body>
</html>
