<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${pageTitle}, ~{::content})}">
<body>
<div th:fragment="content" class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h1 class="h4 mb-0">发布公告</h1>
            <a class="btn btn-outline-secondary btn-sm" href="/announcements">返回</a>
        </div>

        <div class="bg-white border rounded-4 shadow-sm p-3 p-md-4">
            <form method="post" action="/teacher/announcements" th:object="${form}">
                <div class="mb-3">
                    <label class="form-label">标题</label>
                    <input class="form-control" th:field="*{title}" maxlength="200">
                </div>
                <div class="mb-3">
                    <label class="form-label">分类（可选）</label>
                    <input class="form-control" th:field="*{category}" maxlength="50" placeholder="教学通知 / 任务提醒 / 平台更新">
                </div>
                <div class="mb-3">
                    <label class="form-label">内容</label>
                    <textarea class="form-control" th:field="*{content}" rows="10"></textarea>
                </div>
                <button class="btn btn-primary" type="submit">发布</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
