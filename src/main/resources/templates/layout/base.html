<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:text="${pageTitle} ?: '厨学实践教学平台'">厨学实践教学平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
</head>
<body class="tp-body">
<nav class="navbar navbar-expand-lg sticky-top topbar-glass">
    <div class="container-fluid">
        <a class="navbar-brand fw-semibold text-dark" href="/">
            <i class="bi bi-stars me-2"></i>厨学实践教学平台
        </a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="brand-pill" th:if="${sessionRole != null}" th:text="${sessionRole}"></span>
            
            <div class="d-flex align-items-center gap-2" th:if="${sessionUid != null}">
                <img th:if="${sessionAvatar != null}" th:src="${sessionAvatar}" alt="avatar" class="rounded-circle" style="width: 32px; height: 32px; object-fit: cover;">
                <div th:if="${sessionAvatar == null}" class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                    <i class="bi bi-person-fill"></i>
                </div>
                <span class="fw-semibold" th:text="${sessionRealName != null and !sessionRealName.isEmpty() ? sessionRealName : sessionUsername}"></span>
            </div>

            <div th:if="${sessionUid != null}">
                <a class="btn btn-outline-danger btn-sm rounded-pill px-3" href="/logout">退出</a>
            </div>
        </div>
    </div>
</nav>

<div class="container-fluid px-3 px-lg-4 py-3 py-lg-4">
    <div class="row justify-content-center" th:if="${sessionRole == null}">
        <main class="col-12 col-md-11 col-lg-9 col-xl-8 py-4">
            <div class="main-shell login-shell">
                <div th:insert="${content}"></div>
            </div>
        </main>
    </div>

    <div class="row g-3 g-lg-4" th:if="${sessionRole != null}">
        <aside class="col-lg-3 col-xl-2">
            <div class="sidebar-shell">
                <div th:if="${sessionRole == 'ADMIN'}">
                    <div class="sidebar-group-title">管理员菜单</div>
                    <a class="sidebar-link" th:classappend="${requestUri != null and requestUri.startsWith('/admin/dashboard') ? 'active' : ''}" href="/admin/dashboard">
                        <i class="bi bi-speedometer2"></i>后台首页
                    </a>
                    <a class="sidebar-link" th:classappend="${requestUri != null and requestUri.startsWith('/admin/users') ? 'active' : ''}" href="/admin/users">
                        <i class="bi bi-people"></i>用户管理
                    </a>
                    <a class="sidebar-link" th:classappend="${requestUri != null and (requestUri.startsWith('/admin/courses') or requestUri.startsWith('/teacher/courses')) ? 'active' : ''}" href="/admin/courses">
                        <i class="bi bi-journal-album"></i>课程管理
                    </a>
                    <a class="sidebar-link" th:classappend="${requestUri != null and requestUri.startsWith('/profile') ? 'active' : ''}" href="/profile">
                        <i class="bi bi-person-circle"></i>个人中心
                    </a>
                </div>

                <div th:if="${sessionRole == 'TEACHER'}">
                    <div class="sidebar-group-title">教师菜单</div>
                    <a class="sidebar-link" th:classappend="${requestUri != null and requestUri.startsWith('/teacher/dashboard') ? 'active' : ''}" href="/teacher/dashboard">
                        <i class="bi bi-house-door"></i>首页
                    </a>
                    <a class="sidebar-link" th:classappend="${requestUri != null and requestUri.startsWith('/teacher/tasks') ? 'active' : ''}" href="/teacher/tasks">
                        <i class="bi bi-journal-check"></i>任务中心
                    </a>
                    <a class="sidebar-link" th:classappend="${requestUri != null and requestUri.startsWith('/teacher/courses') ? 'active' : ''}" href="/teacher/courses">
                        <i class="bi bi-journal-album"></i>我的课程
                    </a>
                    <a class="sidebar-link" th:classappend="${requestUri != null and requestUri.startsWith('/teacher/submissions') ? 'active' : ''}" href="/teacher/submissions">
                        <i class="bi bi-clipboard2-check"></i>批改中心
                    </a>
                    <a class="sidebar-link" th:classappend="${requestUri != null and requestUri.startsWith('/teacher/resources') ? 'active' : ''}" href="/teacher/resources">
                        <i class="bi bi-folder2-open"></i>资源中心
                    </a>
                    <a class="sidebar-link" th:classappend="${requestUri != null and requestUri.startsWith('/messages') ? 'active' : ''}" href="/messages">
                        <i class="bi bi-chat-dots"></i>私信老师
                    </a>
                    <a class="sidebar-link" th:classappend="${requestUri != null and requestUri.startsWith('/profile') ? 'active' : ''}" href="/profile">
                        <i class="bi bi-person-circle"></i>个人中心
                    </a>
                </div>

                <div th:if="${sessionRole == 'STUDENT'}">
                    <div class="sidebar-group-title">学生菜单</div>
                    <a class="sidebar-link" th:classappend="${requestUri != null and requestUri.startsWith('/student/dashboard') ? 'active' : ''}" href="/student/dashboard">
                        <i class="bi bi-house-door"></i>首页
                    </a>
                    <a class="sidebar-link" th:classappend="${requestUri != null and requestUri.startsWith('/student/courses') ? 'active' : ''}" href="/student/courses">
                        <i class="bi bi-journal-album"></i>课程中心
                    </a>
                    <a class="sidebar-link" th:classappend="${requestUri != null and requestUri.startsWith('/student/tasks') ? 'active' : ''}" href="/student/tasks">
                        <i class="bi bi-journal-text"></i>任务中心
                    </a>
                    <a class="sidebar-link" th:classappend="${requestUri != null and requestUri.startsWith('/student/resources') ? 'active' : ''}" href="/student/resources">
                        <i class="bi bi-collection"></i>资源中心
                    </a>
                    <a class="sidebar-link" th:classappend="${requestUri != null and requestUri.startsWith('/messages') ? 'active' : ''}" href="/messages">
                        <i class="bi bi-chat-dots"></i>私信老师
                    </a>
                    <a class="sidebar-link" th:classappend="${requestUri != null and requestUri.startsWith('/profile') ? 'active' : ''}" href="/profile">
                        <i class="bi bi-person-circle"></i>个人中心
                    </a>
                </div>
            </div>
        </aside>
        <main class="col-lg-9 col-xl-10">
            <div class="main-shell">
                <div th:insert="${content}"></div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
