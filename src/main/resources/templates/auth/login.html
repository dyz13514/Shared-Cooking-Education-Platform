<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${pageTitle}, ~{::content})}">
<body>
<div th:fragment="content" class="row justify-content-center align-items-center" style="min-height: 78vh;">
    <div class="col-12 col-sm-11 col-md-10 col-lg-9 col-xl-8">
        <div class="glass-card p-4 p-md-5 login-card-wide position-relative overflow-hidden">
            <div class="position-absolute top-0 end-0 p-4 opacity-25">
                <i class="bi bi-stars" style="font-size: 4rem;"></i>
            </div>
            <div class="mb-4 pe-5">
                <div class="page-kicker">Teaching Platform</div>
                <h1 class="page-title mb-2">登录平台</h1>
                <p class="page-subtitle mb-0">进入课程、任务、过程与反馈闭环。</p>
            </div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form method="post" th:object="${form}" class="mt-3">
                <div class="row g-3">
                    <div class="col-12 col-lg-6">
                        <label class="form-label text-muted small">用户名</label>
                        <input class="form-control form-control-lg rounded-4" th:field="*{username}" autocomplete="username" placeholder="请输入用户名">
                    </div>
                    <div class="col-12 col-lg-6">
                        <label class="form-label text-muted small">密码</label>
                        <input class="form-control form-control-lg rounded-4" type="password" th:field="*{password}" autocomplete="current-password" placeholder="请输入密码">
                    </div>
                </div>
                <button class="btn btn-tp-primary btn-lg w-100 rounded-pill mt-4" type="submit">登录</button>
            </form>

            <div class="d-flex justify-content-between align-items-center mt-4 small text-muted">
                <span>还没有账号？</span>
                <a href="/register" class="text-decoration-none fw-semibold">注册新账号</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
