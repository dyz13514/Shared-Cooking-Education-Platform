<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${pageTitle}, ~{::content})}">
<body>
<div th:fragment="content" class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-12 col-sm-10 col-md-9 col-lg-7 col-xl-6">
        <div class="glass-card p-4 p-md-5">
            <div class="mb-4">
                <div class="page-kicker">Create Account</div>
                <h1 class="page-title mb-2">注册账号</h1>
                <p class="page-subtitle mb-0">教师与学生都可以注册，后续按角色进入对应工作台。</p>
            </div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form method="post" th:object="${form}" class="mt-3">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label text-muted small">用户名</label>
                        <input class="form-control form-control-lg rounded-4" th:field="*{username}" autocomplete="username" placeholder="3-50位字符">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small">身份</label>
                        <select class="form-select form-select-lg rounded-4" th:field="*{role}">
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small">密码</label>
                        <input class="form-control form-control-lg rounded-4" type="password" th:field="*{password}" autocomplete="new-password" placeholder="至少6位">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small">确认密码</label>
                        <input class="form-control form-control-lg rounded-4" type="password" th:field="*{confirmPassword}" autocomplete="new-password" placeholder="再次输入密码">
                    </div>
                </div>

                <button class="btn btn-tp-primary btn-lg w-100 rounded-pill mt-4" type="submit">创建账号</button>
            </form>

            <div class="d-flex justify-content-between align-items-center mt-4 small text-muted">
                <span>已经有账号？</span>
                <a href="/login" class="text-decoration-none fw-semibold">返回登录</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
