spring.application.name=teaching-platform

# ---- Server ----
server.port=8080

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Database : MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/teaching_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Uploads (预留) ----
app.upload.dir=./uploads

# ---- Logging ----
logging.file.name=./logs/teaching-platform.log

# ---- AI ----
app.ai.enabled=true
app.ai.api-key=${BIGMODEL_API_KEY:}
app.ai.model=glm-z1-flash
app.ai.vision-model=glm-4.6v
app.ai.thinking.enabled=false
